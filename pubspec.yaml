name: exam_app
description: "Exam App - Elevate Online Exams (Flutter, Clean Architecture)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Dependencies specify other packages that your package needs in order to work.
#
# Kept identical to the reference architecture (Clean-Arch-C6-Elevate) wherever
# possible. Any addition beyond the reference set is called out below and was
# introduced only where Phase 1 explicitly required it (design system / fonts).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Carried over as-is from the reference architecture ---
  cupertino_icons: ^1.0.8
  dio:
  retrofit: ^4.9.0
  bloc:
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0

  # --- New for Phase 1 (design system / localization foundation) ---
  # Figma type styles use "Inter" (weights 400/500). Loaded via google_fonts
  # instead of bundling .ttf assets, since no font files were provided yet.
  google_fonts: ^6.2.1
  # SVG icon rendering for Figma-exported icon assets.
  flutter_svg: ^2.0.17
  # --- New for API Integration (Auth Phase) ---
  # Secure token persistence (AES-encrypted on both platforms).
  flutter_secure_storage: ^9.2.4
  # Remember Me flag + lightweight user preferences.
  shared_preferences: ^2.3.4
  # Network image loading with disk/memory caching.
  cached_network_image: ^3.4.1

  # Required by flutter_localizations / ARB-based localization foundation.
  # Left unpinned deliberately: flutter_localizations (SDK) pins an exact
  # intl version per Flutter release, and adding our own caret constraint
  # here is a common source of version-solve conflicts.
  intl:

dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  flutter_lints: ^6.0.0

  # --- Unit testing toolchain (added for full test suite) ---
  # Mocking for Repositories/DataSources/Services — Mockito-free, no codegen.
  mocktail: ^1.0.4
  # Cubit/Bloc state-transition testing (asserts exact emitted state sequence).
  bloc_test: ^9.1.7
  # Deterministic control of Timer/Duration for ExamSessionCubit's countdown.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/files/
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/svg/
